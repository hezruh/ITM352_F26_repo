<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Result</title>
</head>
<body>
    <h1>Quiz Result</h1>
    <p>You are most likely a <strong>{{ generation }}</strong>.</p>
    <ul>
        {% for generation_name, score in scores %}
            <li>{{ generation_name }}: {{ score }}</li>
        {% endfor %}
    </ul>
    <a href="{{ url_for('start') }}">Take Quiz Again</a>
</body>
</html>
