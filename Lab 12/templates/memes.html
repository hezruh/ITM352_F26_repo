<!DOCTYPE html>
<html lang="en">
<head>
    <title>Memes'R'Us</title>
    <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=0.8">
    <meta http-equiv="refresh" content="10; url=http://127.0.0.1:5000">
</head>
<body>
    <h1>Memes'R'Us</h1>
    {% if error %}
        <p>Sorry, the meme could not be retrieved: {{ error }}</p>
    {% else %}
        <h2>Wholesome Meme</h2>
        <img src="{{ meme_url }}" alt="A wholesome meme" style="max-width: 90%;">
        <p>Source: r/{{ subreddit }}</p>
    {% endif %}
    <p>This page refreshes every 10 seconds.</p>
</body>
</html>
